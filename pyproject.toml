[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repaircase"
version = "0.1.0"
description = "Scores approved drugs for a myelin repair trial in multiple sclerosis against a pre-registered rubric"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cedric Conday" }]
dependencies = ["repairmap>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
repaircase = "repaircase.score:main"

# The judgements live in data/ at the top of the repository; a built wheel carries
# the same file as repaircase/data/.
[tool.setuptools]
packages = ["repaircase", "repaircase.data"]

[tool.setuptools.package-dir]
"repaircase.data" = "data"

[tool.setuptools.package-data]
"repaircase.data" = ["judgements.csv"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
